name: Deploy checkout (Stripe worker)

# Run by hand from Actions → "Deploy checkout (Stripe worker)" → Run workflow.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages → right-hand side)
#   STRIPE_SECRET_KEY      (Stripe → Developers → API keys; sk_test_… to start)
#   STRIPE_WEBHOOK_SECRET  (Stripe → Developers → Webhooks → your endpoint → Signing secret)
#   STOCK_GITHUB_TOKEN     (optional: fine-grained token, this repo only, Contents: read & write)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the worker
        run: node checkout-worker/test/worker.test.mjs
      - name: Deploy to Cloudflare and store secrets
        working-directory: checkout-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STOCK_GITHUB_TOKEN: ${{ secrets.STOCK_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."; exit 1; fi
          npx --yes wrangler@4 deploy
          # only upload the secrets you've added; empty ones are skipped
          for s in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if [ -n "${!s}" ]; then printf '%s' "${!s}" | npx --yes wrangler@4 secret put "$s"; else echo "::warning::$s not set yet"; fi
          done
          if [ -n "$STOCK_GITHUB_TOKEN" ]; then printf '%s' "$STOCK_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN; else echo "Stock auto-update off (no STOCK_GITHUB_TOKEN)."; fi
          echo "### Checkout deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Put the workers.dev address shown above into checkoutUrl in app.js, and use <address>/webhook for the Stripe webhook." >> "$GITHUB_STEP_SUMMARY"
