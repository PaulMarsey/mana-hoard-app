plugins { id 'com.android.application' }

// The shop this app shows. Change these if you move to your own domain (e.g. manahoard.co.uk).
def shopHost = 'paulmarsey.github.io'
def shopPath = '/mana-hoard-app'
def shopUrl  = 'https://paulmarsey.github.io/mana-hoard-app/'

android {
    namespace 'uk.co.manahoard.app'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.manahoard.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2-test'
        buildConfigField 'String', 'SHOP_URL', "\"${shopUrl}\""
        buildConfigField 'String', 'SHOP_HOST', "\"${shopHost}\""
        buildConfigField 'String', 'SHOP_PATH', "\"${shopPath}\""
        manifestPlaceholders = [shopHost: shopHost, shopPath: shopPath]
    }
    buildFeatures { buildConfig true }
    // TEST signing key only (committed so each test build installs over the last).
    // Make a private key before publishing to Google Play.
    signingConfigs {
        test { storeFile file('../test-signing.keystore'); storePassword 'manahoard-test'; keyAlias 'manahoard'; keyPassword 'manahoard-test' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.test }
        release { signingConfig signingConfigs.test; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'   // Custom Tabs for Stripe checkout (keeps Google Pay working)
}
